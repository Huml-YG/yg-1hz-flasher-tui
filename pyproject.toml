[project]
name = "nbus-term"
version = "0.1.0"
description = "A little TUI for poking an NBUS device over its temperature-sensor port"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "textual>=0.60",
]

[project.scripts]
nbus-term = "nbus_term:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["nbus_term.py"]
